      - "Evidence mapped to the goal oracle."
      - "Missing evidence or next task if not complete."
    receipt:
      result: done
      decision: complete
      full_outcome_complete: true
      summary: "The full scenario-grid outcome is complete. The unified script exists, compiles, runs successfully, writes all required outputs, covers all 11 required scenarios, estimates all required stage 2 and stage 3 outcome rows, validates the current baseline against saved outputs, identifies the one underpowered scenario, and provides a ranked dissertation recommendation."
