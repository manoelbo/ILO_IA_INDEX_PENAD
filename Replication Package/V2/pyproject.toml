[project]
name = "dissertation-replication-v2"
version = "0.1.0"
description = "Replication package for the dissertation empirical refresh."
requires-python = "==3.10.*"
dependencies = [
    "geopandas==1.1.0",
    "matplotlib==3.10.8",
    "numpy==2.2.6",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "pillow==12.1.1",
    "pyarrow==23.0.0",
    "pyogrio==0.12.1",
    "pyfixest==0.40.1",
    "scipy==1.15.3",
    "shapely==2.1.0",
    "py7zr==1.1.3",
    "requests==2.34.2",
]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]

[tool.uv]
package = false
